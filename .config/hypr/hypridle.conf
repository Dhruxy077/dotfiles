general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock
    before_sleep_cmd = playerctl pause ; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         
    on-resume = brightnessctl -r                 # monitor backlight restore.
}
listener{
  timeout = 200
  on-timeout = $HOME/.local/bin/screensaver/screensaver.sh
  # on-resume = pkill -f org.dhruvin.screensaver
  on-resume = pkill -f org.dhruvin.screensaver ; rm -f /tmp/screensaver.exit /tmp/screensaver.running
}

listener {
    timeout = 700                                
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

listener {
    timeout = 1300                               
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                               # 30min
    on-timeout = systemctl suspend               # suspend pc
}
