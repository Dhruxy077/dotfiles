# ==============================================================================
# Variables
# ==============================================================================
$mainMod      = SUPER
$ipc          = qs -c noctalia-shell ipc call
$TERMINAL     = ghostty
$BROWSER      = zen-browser
$FILE_MANAGER = thunar
$CODE         = nvim

# 1. SESSION
bind = $mainMod CTRL,  R,      exec, hyprctl reloadclear && $ipc toast send '{"title": "Hyprland", "body": "Hyprland Configuration Reloaded", "icon": "reload"}' #"Reload Hyprland config"
bind = $mainMod,       L,      exec, $ipc lockScreen lock #"Lock screen"
bind = $mainMod,       ESCAPE, exec, $ipc sessionMenu toggle #"Session menu"

# 2. SHELL & MENUS
bind = $mainMod,        SPACE,  exec, $ipc launcher toggle #"App launcher"
bind = $mainMod SHIFT,  SPACE,  exec, $ipc bar toggle #"Toggle bar"
bind = $mainMod SHIFT,  R,      exec, $ipc controlCenter toggle #"Control center"
bind = $mainMod,        R,      exec, $ipc settings toggle #"Settings"
bind = $mainMod,        V,      exec, $ipc launcher clipboard #"Clipboard history"
bind = $mainMod SHIFT,  V,      exec, $ipc launcher emoji #"Emoji picker"
bind = $mainMod SHIFT,  ESCAPE, exec, $ipc systemMonitor toggle #"System monitor"
bind = $mainMod,        slash,  exec, $ipc plugin:keybind-cheatsheet toggle #"Keybind cheatsheet"

# 3. WALLPAPER
bind = $mainMod,        Y, exec, $ipc wallpaper toggle && $ipc toast send '{"title": "Wallpaper Daemon", "body": "Wallpaper changed", "icon": "wallpaper reload"}' #"Wallpaper corner"
bind = $mainMod SHIFT,  Y, exec, $ipc wallpaper toggleAutomation && $ipc toast send '{"title": "Wallpaper Daemon", "body": "Wallpaper changed", "icon": "wallpaper reload"}' #"Toggle wallpaper automation"

# 4. APPLICATIONS
bind = $mainMod,        RETURN, exec, $TERMINAL #"Terminal"
bind = $mainMod,        E,      exec, $FILE_MANAGER #"File manager"
bind = $mainMod,        W,      exec, $BROWSER #"Browser"
bind = $mainMod,        M,      exec, spotify-launcher #"Spotify"

# 5. WINDOW MANAGEMENT
bind = $mainMod,        Q,  killactive, #"Close window"
bind = $mainMod SHIFT,  Q,  forcekillactive, #"Force kill window"
bind = $mainMod,        F,  fullscreen, 1 #"Toggle maximize"
bind = $mainMod SHIFT,  F,  fullscreen, #"Toggle fullscreen"
bind = $mainMod ALT,    F,  togglefloating, #"Toggle floating"
bind = $mainMod,        U,  pin, #"Pin window"
bind = $mainMod,        P,  pseudo, #"Toggle pseudo-tiling"
bind = $mainMod,        Z,  resizeactive, -25% -20% #"Shrink window"
bind = $mainMod,        C,  resizeactive, 25% 20% #"Grow window"

# 6. FOCUS
bind = $mainMod, left,  movefocus, l #"Focus left"
bind = $mainMod, right, movefocus, r #"Focus right"
bind = $mainMod, up,    movefocus, u #"Focus up"
bind = $mainMod, down,  movefocus, d #"Focus down"

# 7. WINDOW SWAPPING
bind = $mainMod SHIFT, left,  swapwindow, l #"Swap left"
bind = $mainMod SHIFT, right, swapwindow, r #"Swap right"
bind = $mainMod SHIFT, up,    swapwindow, u #"Swap up"
bind = $mainMod SHIFT, down,  swapwindow, d #"Swap down"

# 8. GROUPS
bind = $mainMod,       O,         togglegroup, #"Toggle group"
bind = $mainMod,       K, changegroupactive, f #"Next in group"
bind = $mainMod,       J,         changegroupactive, b #"Prev in group"
bind = $mainMod,       H,         global, veil:toggle-focused #"Hide focused window"
bind = $mainMod SHIFT, H,         global, veil:open-restore-menu #"Restore hidden windows"

# 9. WORKSPACES
bind = $mainMod, 1, workspace, 1 #"Workspace 1"
bind = $mainMod, 2, workspace, 2 #"Workspace 2"
bind = $mainMod, 3, workspace, 3 #"Workspace 3"
bind = $mainMod, 4, workspace, 4 #"Workspace 4"
bind = $mainMod, 5, workspace, 5 #"Workspace 5"
bind = $mainMod, 6, workspace, 6 #"Workspace 6"

bind = $mainMod CTRL, right, workspace, +1 #"Next workspace"
bind = $mainMod CTRL, left,  workspace, -1 #"Prev workspace"
bind = ALT,           TAB,   cyclenext, hist, prev #"Cycle windows (history)"
bind = $mainMod,       Tab,   global, tabber:select-next #"Tabber: next"
bind = $mainMod SHIFT, Tab,   global, tabber:select-previous #"Tabber: prev"
bind = $mainMod,       Grave, global, tabber:enter-group #"Tabber: enter group"
# bind = ,               Alt_L, global, tabber:release-alt-left #"Tabber: release alt-L"
# bind = ,               Alt_R, global, tabber:release-alt-right #"Tabber: release alt-R"

# 10. MOVE TO WORKSPACE
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Move to workspace 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Move to workspace 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Move to workspace 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Move to workspace 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Move to workspace 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Move to workspace 6"
bind = $mainMod SHIFT, right, movetoworkspace, +1 #"Move to previous workspace"
bind = $mainMod SHIFT,  left, movetoworkspace, -1 #"Move to next workspace"

# 11. SPECIAL WORKSPACE
bind = $mainMod,            S, togglespecialworkspace, magic #"Toggle scratchpad"
bind = $mainMod SHIFT,      S, movetoworkspacesilent, special:magic #"Send to scratchpad (silent)"
bind = $mainMod SHIFT CTRL, S, movetoworkspace, special:magic #"Send to scratchpad"

# 12. LAYOUT
bind = $mainMod,       A, layoutmsg, swapsplit #"Swap split (dwindle)"
bind = $mainMod,       D, layoutmsg, togglesplit #"Toggle split (dwindle)"
bind = $mainMod,       X, layoutmsg, swapwithmaster master #"Swap with master"
bind = $mainMod SHIFT, A, layoutmsg, cycleprev #"Cycle prev (master)"
bind = $mainMod SHIFT, X, layoutmsg, focusmaster #"Focus master"
bind = $mainMod SHIFT, D, layoutmsg, cyclenext #"Cycle next (master)"

# 13. MEDIA
bind = $mainMod SHIFT, M, exec, $ipc media toggle #"Toggle media"

# 14. HARDWARE KEYS
bind = , XF86AudioRaiseVolume,  exec, $ipc volume increase #"Volume up"
bind = , XF86AudioLowerVolume,  exec, $ipc volume decrease #"Volume down"
bind = , XF86AudioMute,         exec, $ipc volume muteOutput #"Mute output"
bind = , XF86AudioMicMute,      exec, $ipc volume muteInput #"Mute mic"
bind = , XF86AudioPlayPause,    exec, $ipc media playPause #"Play/pause"
bind = , XF86AudioPlay,         exec, $ipc media play #"Play"
bind = , XF86AudioPause,        exec, $ipc media pause #"Pause"
bind = , XF86AudioNext,         exec, $ipc media next #"Next track"
bind = , XF86AudioPrev,         exec, playerctl previous #"Prev track"
bind = , Pause,                 exec, $ipc media pause #"Pause (Pause key)"

# 15. BRIGHTNESS
bind = , XF86MonBrightnessUp,   exec, $ipc brightness increase #"Brightness up"
bind = , XF86MonBrightnessDown, exec, $ipc brightness decrease #"Brightness down"
bind = , Prior,                 exec, $ipc brightness increase #"Brightness up (PgUp)"
bind = , Next,                  exec, $ipc brightness decrease #"Brightness down (PgDn)"

# 16. SCREENSHOTS & RECORDING
bind = ,           Print, exec, hyprshot -m output #"Screenshot (full)"
bind = $mainMod,   Print, exec, hyprshot -m region #"Screenshot (region)"
# bind = CTRL,       Print, exec, $HYPR_SCRIPTS/toggle_recording #"Record screen"
# bind = CTRL SHIFT, Print, exec, $HYPR_SCRIPTS/toggle_recording --select #"Record region"

# 17. MOUSE
bindm = $mainMod, mouse:272, movewindow #"Move window"
bindm = $mainMod, mouse:273, resizewindow #"Resize window"
