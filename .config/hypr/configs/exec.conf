# 1. System & Authentication
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xfce-polkit/xfce-polkit

# 2. Daemons & UI
exec-once = swww-daemon
exec-once = qs -c noctalia-shell
exec-once = hypridle

# 3. Cursor Theme & Size (Hyprland + GTK)
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# 4. Clipboard Manager (Shared Database Limit)
exec-once = wl-paste --type text --watch cliphist -max-items 50 store
exec-once = wl-paste --type image --watch cliphist -max-items 50 store
exec-once = wl-clip-persist --clipboard regular

# 5. Restore Keyboard Backlight State
exec-once = brightnessctl -r -d dell::kbd_backlight
