# https://wiki.hyprland.org/Configuring/Animations/

animations {
    # first_launch_animation = false
    
    # bezier = md3_decel,     0.05, 0.70,  0.10,  1.00
    # bezier = md3_accel,     0.30, 0.00,  0.80,  0.15
    # bezier = menu_decel,    0.10, 1.00,  0.00,  1.00
    # bezier = menu_accel,    0.38, 0.04,  1.00,  0.07
    # bezier = windMove,      0.83, 0.00,  0.17,  1.00
    #
    # animation = windows,    1, 3, md3_decel, popin 60%
    # animation = windowsIn,  1, 3, md3_decel, popin 10%
    # animation = windowsOut, 1, 3, md3_accel, popin 10%
    #
    # animation = layersIn,   1, 2.4, menu_decel, slide
    # animation = layersOut,  1, 1.5, menu_accel, slide
    #
    # animation = border,           1, 10,  default
    # animation = borderangle,      0
    # animation = fade,             1, 3,   md3_decel
    # animation = fadeLayersIn,     1, 2,   menu_decel
    # animation = fadeLayersOut,    1, 4.5, menu_accel
    # animation = workspaces,       1, 4,   windMove,   slide
    # animation = specialWorkspace, 1, 3,   md3_decel,  slidefadevert 15%



    enabled = true

    # --- THE PHYSICS (Hyper-Tuned Curves) ---
    # The "Spring": Massive initial acceleration, controlled overshoot, and a satisfying snap.
    bezier = spring, 0.175, 0.885, 0.32, 1.275
    # The "Whip": Frictionless slide, perfect for moving windows around your grid.
    bezier = whip, 0.05, 0.9, 0.1, 1.1
    # The "Black Hole": Accelerates into nothingness for closing. Extremely fast and clean.
    bezier = blackHole, 0.55, 0.085, 0.68, 0.53
    # linear: Required for perfectly aligned, stutter-free gradient borders.
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    # --- WINDOWS (The Maximum "Pop") ---
    # popin 50% makes it grow from half-size. Combined with the spring curve, 
    # it gives maximum visual impact without feeling jarring.
    animation = windowsIn, 1, 5, spring, popin 50%
    # Closes violently fast (speed 2.5) to clear screen space instantly.
    animation = windowsOut, 1, 2.5, blackHole, popin 80%
    animation = windowsMove, 1, 4, whip, slide

    # --- BORDERS & SHADOWS ---
    animation = border, 1, 3, whip
    animation = borderangle, 1, 30, linear, loop
    animation = fadeShadow, 1, 3, blackHole

    # --- FADES ---
    animation = fade, 1, 3, whip
    animation = fadeIn, 1, 3, whip
    animation = fadeOut, 1, 3, blackHole

    # --- WORKSPACES & LAYERS (The UX Upgrade) ---
    # slidefade 50%: Makes workspaces feel like they are panning across a massive 
    # ultrawide canvas rather than just shifting rigid boxes.
    animation = workspaces, 1, 6, whip, slidefade 50%
    # Slidevert drops the scratchpad in from the top like a dropdown terminal.
    animation = specialWorkspace, 1, 5, whip, slidevert

    # --- LAYERS (App launchers, menus, bars) ---
    animation = layersIn, 1, 4, spring, fade
    animation = layersOut, 1, 2.5, blackHole, fade
}
