# Monitor Configuration
# Adjust these values to match your display setup.
# Use `hyprctl monitors` or `nwg-displays` to detect your monitors.

# Primary monitor (laptop display — common default)
monitor = eDP-1, 2560x1600@120, 0x0, 1.5

# External monitor example (uncomment and adjust as needed)
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
# monitor = DP-1, 2560x1440@144, 0x0, 1

# Fallback: use the preferred mode for any unknown monitor
monitor = , preferred, auto, 1
